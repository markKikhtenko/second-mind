[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "second-mind"
version = "0.2.0"
description = "Local-first personal AI assistant with desktop, Telegram, memory and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Second Mind Contributors" }]
dependencies = [
  "aiogram>=3.15,<4",
  "apscheduler>=3.10,<4",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25.5,<27",
  "mcp>=1.12,<2",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.1,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
speech = ["faster-whisper>=1.1,<2"]
build = ["pyinstaller>=6.11,<7"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
all = [
  "PySide6-Essentials>=6.8,<7",
  "faster-whisper>=1.1,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
second-mind-core = "second_mind.server:main"
second-mind-desktop = "second_mind.desktop:main"
second-mind-mcp = "second_mind.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/second_mind"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
